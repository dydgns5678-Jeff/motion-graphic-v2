<!--
  부품: 용어 + 정의 (역할 칸: 정의 · 사료 · 정리)
  바꾸는 부분: [data-slot="term"] 용어, [data-slot="sentence"] 정의 · 인용 · 마무리 문장, [data-slot="example"] 예 한 줄(없으면 비운다), [data-slot="source"] 출처.
  건드리지 않는 것: 이 부품의 강조는 주황 용어 한 군데뿐 (roles.md "강조 표시 한 군데", video.md 3장 "한 화면 강조 한 가지"). 문장 안에는 강조를 넣지 않는다. 용어 var(--color-accent) · var(--text-title) · 굵기 700, 문장 var(--text-body) · var(--color-ink), 예의 수 · 기호는 var(--font-serif) · var(--text-math) · var(--weight-math), 예 속 한글은 <span class="ko">로 감싸 고딕, 가운데 정렬, 문장 최대 폭 1400px.
  따로 움직일 수 있는 조각: [data-piece="term"], [data-piece="sentence"], [data-piece="example"], [data-piece="source"].
  견본 글: 직접 쓴 것 (교과서 원문 아님).
  출처: docs/design.md 1장 color-accent (B 0:33 「절반인」 한 낱말만 주황), 2장 글자, 4장 구도 (B 0:34 제목 + 설명 가운데 정렬).
-->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_tokens.css">
<style>
  .stack {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: var(--space-stack);
    color: var(--color-ink); text-align: center;
  }
  .term { font-family: var(--font-sans); font-weight: 700; font-size: var(--text-title); color: var(--color-accent); line-height: 1.2; }
  .sentence { max-width: 1400px; font-family: var(--font-sans); font-weight: 600; font-size: var(--text-body); line-height: 1.45; }
  .example { font-family: var(--font-serif); font-weight: var(--weight-math); font-size: var(--text-math); line-height: 1.2; letter-spacing: 0.02em; }
  .example .op { margin: 0 0.3em; }
  .example .ko { font-family: var(--font-sans); font-weight: 600; font-size: var(--text-body); }
  .source { font-family: var(--font-sans); font-weight: 600; font-size: var(--text-label); color: var(--color-ink-soft); margin-top: var(--space-tight); }
</style>
</head>
<body class="preview">
  <div class="stack">
    <p class="term" data-slot="term" data-piece="term">서로소</p>
    <p class="sentence" data-slot="sentence" data-piece="sentence">두 자연수의 최대공약수가 1이면, 두 수는 서로소이다.</p>
    <p class="example" data-slot="example" data-piece="example">5<span class="ko">와 </span>8<span class="op">→</span><span class="ko">최대공약수 </span>1</p>
    <p class="source" data-slot="source" data-piece="source">교과서 p.22</p>
  </div>
</body>
</html>
